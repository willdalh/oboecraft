[versions]
minecraft = "26.3"
fabric-loader = "0.20.1"
fabric-api = "0.165.2+26.3"
fabric-loom = "1.19.3"
junit = "6.1.3"
sudachi = "0.8.2"
gson = "2.14.0"
modmenu = "21.0.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
