name: Release

# Publishes a GitHub release of main when someone runs this workflow by hand from the Actions tab. The version is the
# highest vX.Y.Z tag with the chosen part bumped. Nothing is committed or pushed to main. See AGENTS.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

# Runs one at a time, so two runs never work out and create the same release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check that the release is of main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are made only from main, not from $REF."
            exit 1
          fi

      # The tags are needed to work out the version.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(git tag --list | .github/scripts/next-version.sh "$BUMP")
          echo "Releasing $version at $(git rev-parse HEAD)."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pversion="$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: fabric/build/libs/oboecraft-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  # Only this job can write to the repository, and it runs none of the project's code.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mod-jar

      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          # gh release create would reuse a tag that exists, so a tag made since the build job fetched them stops it.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')
          if grep -qxF "refs/tags/v$VERSION" <<< "$refs"; then
            echo "::error::The tag v$VERSION already exists."
            exit 1
          fi
          gh release create "v$VERSION" "oboecraft-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Oboecraft $VERSION" \
            --generate-notes
