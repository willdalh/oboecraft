name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, unit tests and server game tests
        shell: bash
        run: ./gradlew --no-daemon build
      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/junit.xml
            **/build/run/**/logs/
            **/run*/logs/
          if-no-files-found: ignore
      - name: Upload mod
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: oboecraft
          path: fabric/build/libs/oboecraft-*.jar
