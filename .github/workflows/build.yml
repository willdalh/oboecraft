name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the older push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # build runs the core unit tests and the Fabric game tests on a headless server.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
            fabric/build/run/*/logs/
            fabric/build/run/*/crash-reports/
          if-no-files-found: ignore
