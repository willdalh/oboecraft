name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the older push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test working out the release version
        run: .github/scripts/next-version-test.sh

      # build runs the core unit tests and the Fabric game tests on a headless server.
      - run: ./gradlew build

      # The client game tests run a real client in a virtual display. Minecraft can't get an OpenGL context from
      # Xvfb's software GLX, so it falls back to Vulkan, which Mesa's lavapipe driver runs on the CPU.
      - name: Install a virtual display and a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers

      - name: Run the client game tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
            fabric/build/run/*/logs/
            fabric/build/run/*/crash-reports/
            fabric/build/run/*/screenshots/
          if-no-files-found: ignore
