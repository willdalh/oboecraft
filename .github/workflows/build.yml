name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # build runs the core unit tests and the Fabric game tests on a headless server.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore
